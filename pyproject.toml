[project]
name = "aams"
version = "0.1.0"
description = "Adaptive Autonomous Memory Subsystem (bootstrap contracts)"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
mcp = ["mcp==2.3.0", "pydantic>=2.12,<3"]

[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
