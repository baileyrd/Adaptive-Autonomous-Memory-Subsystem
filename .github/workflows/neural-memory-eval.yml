name: Optional neural memory attribution

on:
  pull_request:
    paths:
      - scripts/profile_retrieval_memory.py
      - .github/workflows/neural-memory-eval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . onnxruntime==1.32.0 tokenizers==0.23.3 numpy==2.5.3
      - name: Fetch pinned MiniLM and workload
        run: |
          set -euo pipefail
          mkdir out
          git rev-parse HEAD > out/tested-sha.txt
          python -m pip freeze > out/packages.txt
          python scripts/prepare_onnx_variant.py minilm-l3-q8 model
          cp model/manifest.json out/manifest.json
          python -c 'import json; json.dump(json.load(open("model/manifest.json"))["files"], open("model/pins.json", "w"))'
          for split in dev train; do
            curl -fsSL --retry 2 --max-time 90 "https://raw.githubusercontent.com/rajpurkar/SQuAD-explorer/eee5fdbf62f8613a7812b03419e6b29617b74fd1/dataset/$split-v1.1.json" -o "$split.json"
          done
      - name: Reproduce v0.9 cost baseline then attribute processes on same host
        run: |
          set -euo pipefail
          python scripts/profile_neural_memory.py --model-dir model --pins model/pins.json > out/dependencies.json
          for split in dev train; do
            python scripts/benchmark_onnx_cpu.py --model model --variant model/manifest.json --data "$split.json" --partition "$split" > "out/cost-$split.json"
            python scripts/profile_retrieval_memory.py --model model --variant model/manifest.json --data "$split.json" --partition "$split" > "out/memory-$split.json"
            python - "$split" <<'PY'
          import json
          import sys
          split = sys.argv[1]
          cost = json.load(open(f"out/cost-{split}.json"))
          diagnostic = json.load(open(f"out/memory-{split}.json"))
          keys = ("wall_ms", "peak_rss_kib", "added_p95_ms", "rss_ratio", "qualifies")
          summary = {arm: {key: row[key] for key in keys if key in row}
                     for arm, row in cost["arms"].items()}
          print(f"::notice title=Matched cost {split}::{json.dumps(summary)}")
          print(f"::notice title=Memory diagnostic {split}::{json.dumps(diagnostic)}")
          PY
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-memory-attribution
          path: out/
