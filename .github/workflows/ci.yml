name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Python ${{ matrix.python-version }} contract checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned lint tooling
        run: python -m pip install ruff==0.14.6 ".[mcp]"
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Lint check
        run: ruff check src tests scripts
      - name: Compile check
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run MCP acceptance demo
        run: python -m aams.demo
